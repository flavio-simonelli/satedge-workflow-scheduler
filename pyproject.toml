[project]
name = "satedge-workflow-scheduler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Flavio Simonelli", email = "flavio.simonelli.se@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
satedge-workflow-scheduler = "satedge_workflow_scheduler:main"

[project.optional-dependencies]
gurobi = [
    "gurobipy>=13,<14",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "gurobipy>=13,<14",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["tests/milp"]
