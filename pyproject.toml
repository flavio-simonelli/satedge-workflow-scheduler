[project]
name = "satedge-workflow-scheduler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Flavio Simonelli", email = "flavio.simonelli.se@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6",
]

[project.scripts]
satedge-workflow-scheduler = "satedge_workflow_scheduler.cli:main"

[project.optional-dependencies]
gurobi = [
    "gurobipy>=13,<14",
]
plot = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "gurobipy>=13,<14",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["tests/milp"]
